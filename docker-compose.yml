services:
  hospital-outbreak-cluster-engine:
    build: .
    container_name: hospital-outbreak-cluster-engine
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY in the environment before starting}
      - API_ACCESS_TOKEN=${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN in the environment before starting}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
